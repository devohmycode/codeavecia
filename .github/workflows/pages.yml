# Publie le dossier pages/ sur GitHub Pages : chaque .html déposé dans pages/ est en ligne
# après le push sur main. Indépendant du site Astro (site/), déployé par Cloudflare Pages.
name: Pages HTML

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
      - ".github/scripts/pages-index.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer l'index
        run: node .github/scripts/pages-index.mjs pages && touch pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
