[project]
name = "codeavecia-studio"
version = "0.1.0"
description = "Atelier vidéo local de CodeAvecIA : capture, transcription, dérushage, commentaire, voix, montage, rendu"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    # faster-whisper 1.2 appelle av.open(metadata_errors=…), argument retiré des versions récentes de PyAV.
    "av>=14,<16",
    "faster-whisper>=1.2",
    "filelock>=3.16",
    "httpx>=0.28",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
studio = "noyau.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noyau", "pipeline", "connecteurs"]
